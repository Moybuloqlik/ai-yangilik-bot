name: Kunlik reja

on:
  schedule:
    - cron: "0 0 * * *"   # 00:00 UTC = Toshkent vaqti 05:00
  workflow_dispatch:
    inputs:
      kun:
        description: "Sinov uchun kun raqami (0=dushanba, 1=seshanba ... 6=yakshanba). Bo'sh qoldirsangiz, bugungi kun."
        required: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rejani yuborish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_DAY: ${{ github.event.inputs.kun }}
        run: python bot.py
